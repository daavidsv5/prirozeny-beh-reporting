name: Update Data

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 06:00 CET / 07:00 CEST
  workflow_dispatch:        # Možnost spustit ručně přes GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        run: node scripts/updateData.js
        env:
          UPGATES_API_URL: ${{ secrets.UPGATES_API_URL }}
          UPGATES_LOGIN: ${{ secrets.UPGATES_LOGIN }}
          UPGATES_API_KEY: ${{ secrets.UPGATES_API_KEY }}

      - name: Commit and push updated data
        run: |
          git add data/
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: auto-update data $(date -u +%Y-%m-%d)"
            git push
          )
